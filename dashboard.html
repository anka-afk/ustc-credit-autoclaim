<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>Qoder 额度监控统计</title>
<style>
:root{--bg:#0d1219;--card:#161e2a;--line:#232d3b;--fg:#e6ebf2;--muted:#9aa6b6;
--accent:#5b9bf0;--good:#3fb96f;--warn:#e0a03a;--bad:#e06c5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);line-height:1.6;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{font-size:20px;margin:0}
.meta{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card .label{color:var(--muted);font-size:13px}
.card .value{font-size:28px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.card .sub{color:var(--muted);font-size:12px;margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.hot{background:var(--good)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
.panel h2{font-size:15px;margin:0 0 10px}
svg{width:100%;height:auto;display:block}
.grid{stroke:var(--line);stroke-width:1}
.thresh{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:6 4}
.axis{fill:var(--muted);font-size:11px}
.area{fill:var(--accent);opacity:.15}
.line{fill:none;stroke:var(--accent);stroke-width:2}
.claimline{stroke:var(--good);stroke-width:1.5;opacity:.7}
.claimdot{fill:var(--good)}
.empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
footer{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Qoder 额度监控统计</h1>
  <span class="meta" id="updated"></span>
</header>
<div class="cards" id="cards"></div>
<div class="panel">
  <h2>总额度用量曲线(绿线 = 自动领取时刻,虚线 = 90% 领取门槛)</h2>
  <div id="chart"></div>
</div>
<div class="cols">
  <div class="panel"><h2>领取记录</h2><div id="claims"></div></div>
  <div class="panel"><h2>最近领取失败</h2><div id="failures"></div></div>
</div>
<footer>数据来源:credit-bot 每次轮询自动写入 · 本页每 30 秒自动刷新 · 阈值由 TokenWorks 服务端判定</footer>
</div>
<script>
const DATA = "__STATS_DATA__";
const TASKS = {tokenworks:'安装词元工坊',iwan:'用过 iWan',ustcapp:'安装科大 App',nfc:'NFC 校园卡',survey:'调查问卷',invite:'邀请同学',checkin:'每日签到'};
const fmtTime = t => { const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes()); };
const fmtFull = t => { const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return (d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('updated').textContent = DATA.generatedAt ? '更新于 '+fmtFull(DATA.generatedAt) : '暂无数据';

// ---- 概览卡片 ----
const c = DATA.current;
const totalClaimed = DATA.claims.reduce((s,x)=>s+x.amount,0);
let cardsHtml = '';
if (c) {
  const total = c.seatTotal + c.claimed;
  const usedTotal = c.seat + c.usedClaimed;
  const need = Math.max(0, Math.ceil(total*0.9) - usedTotal);
  const hot = c.pct >= 90;
  cardsHtml += `<div class="card"><div class="label">当前总额度用量</div><div class="value ${hot?'ok':''}">${c.pct}%</div><div class="sub">${usedTotal.toLocaleString()} / ${total.toLocaleString()} credits</div><div class="bar"><i class="${hot?'hot':''}" style="width:${Math.min(100,c.pct)}%"></i></div></div>`;
  cardsHtml += `<div class="card"><div class="label">距下次可领(估算)</div><div class="value">${need>0?need.toLocaleString():'已达标'}</div><div class="sub">${need>0?'还需消耗 '+need.toLocaleString()+' credits':'等待 bot 自动领取'}</div></div>`;
  cardsHtml += `<div class="card"><div class="label">已领共享额度</div><div class="value">${c.claimed.toLocaleString()}</div><div class="sub">席位 ${c.seat.toLocaleString()} / ${c.seatTotal.toLocaleString()} · 已领已用 ${c.usedClaimed.toLocaleString()}</div></div>`;
} else {
  cardsHtml += '<div class="card"><div class="label">当前状态</div><div class="value">--</div><div class="sub">启动监控后自动显示</div></div>';
}
cardsHtml += `<div class="card"><div class="label">累计自动领取</div><div class="value ok">+${totalClaimed.toLocaleString()}</div><div class="sub">${DATA.claims.length} 次成功领取</div></div>`;
document.getElementById('cards').innerHTML = cardsHtml;

// ---- 用量曲线 ----
(function(){
  const H = DATA.history;
  const box = document.getElementById('chart');
  if (!H.length) { box.innerHTML = '<div class="empty">暂无历史数据,监控运行后自动积累(每 30 秒一个点,保留最近 24 小时)</div>'; return; }
  const W=860, HH=260, L=44, R=14, T=14, B=26;
  const t0=H[0].t, t1=Math.max(H[H.length-1].t, t0+600000);
  const x = t => L + (t-t0)/(t1-t0)*(W-L-R);
  const y = p => T + (1-p/100)*(HH-T-B);
  let s = `<svg viewBox="0 0 ${W} ${HH}" xmlns="http://www.w3.org/2000/svg">`;
  for (const g of [0,25,50,75,100]) {
    s += `<line class="grid" x1="${L}" y1="${y(g)}" x2="${W-R}" y2="${y(g)}"/>`;
    s += `<text class="axis" x="${L-8}" y="${y(g)+4}" text-anchor="end">${g}%</text>`;
  }
  s += `<line class="thresh" x1="${L}" y1="${y(90)}" x2="${W-R}" y2="${y(90)}"/>`;
  s += `<text class="axis" x="${L+6}" y="${y(90)-5}" text-anchor="start" fill="var(--warn)">90% 门槛</text>`;
  const ticks=4;
  for (let i=0;i<=ticks;i++){
    const t=t0+(t1-t0)*i/ticks;
    s += `<text class="axis" x="${x(t)}" y="${HH-8}" text-anchor="middle">${fmtTime(t)}</text>`;
  }
  const pts = H.map(p=>`${x(p.t).toFixed(1)},${y(p.pct).toFixed(1)}`);
  s += `<path class="area" d="M${x(H[0].t).toFixed(1)},${y(0)} L${pts.join(' L')} L${x(H[H.length-1].t).toFixed(1)},${y(0)} Z"/>`;
  s += `<polyline class="line" points="${pts.join(' ')}"/>`;
  for (const cl of DATA.claims) {
    if (cl.t < t0 || cl.t > t1) continue;
    const cx=x(cl.t);
    s += `<line class="claimline" x1="${cx}" y1="${T}" x2="${cx}" y2="${HH-B}"><title>${fmtFull(cl.t)} 领取 ${esc(TASKS[cl.task]||cl.task)} +${cl.amount}</title></line>`;
    s += `<circle class="claimdot" cx="${cx}" cy="${T+4}" r="3.5"><title>${fmtFull(cl.t)} +${cl.amount}</title></circle>`;
  }
  const last=H[H.length-1];
  s += `<circle cx="${x(last.t)}" cy="${y(last.pct)}" r="3.5" fill="var(--accent)"/>`;
  s += '</svg>';
  box.innerHTML = s;
})();

// ---- 表格 ----
(function(){
  const box=document.getElementById('claims');
  if(!DATA.claims.length){box.innerHTML='<div class="empty">还没有领取记录</div>';return;}
  let h='<table><tr><th>时间</th><th>任务</th><th>额度</th></tr>';
  for(const cl of [...DATA.claims].reverse().slice(0,50)){
    h+=`<tr><td>${fmtFull(cl.t)}</td><td>${esc(TASKS[cl.task]||cl.task)}</td><td class="ok">+${cl.amount.toLocaleString()}</td></tr>`;
  }
  box.innerHTML=h+'</table>';
})();
(function(){
  const box=document.getElementById('failures');
  if(!DATA.failures.length){box.innerHTML='<div class="empty">没有失败记录</div>';return;}
  let h='<table><tr><th>时间</th><th>任务</th><th>原因</th></tr>';
  for(const f of [...DATA.failures].reverse().slice(0,30)){
    h+=`<tr><td>${fmtFull(f.t)}</td><td>${esc(TASKS[f.task]||f.task)}</td><td class="warn">${esc(f.desc)}</td></tr>`;
  }
  box.innerHTML=h+'</table>';
})();
</script>
</body>
</html>
